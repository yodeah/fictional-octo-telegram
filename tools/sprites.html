<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Underworld Duel — sprite gallery</title>
  <style>body{background:#16303a;color:#dfe;font:13px system-ui;margin:12px}canvas{display:block}</style>
  <script src="../hades/data.js"></script>
  <script src="../hades/sprites.js"></script>
</head>
<body>
  <p>Baked fighter frames at full resolution. <code>?kit=murmillo&amp;team=0&amp;weapon=gladius&amp;spare=pilum</code></p>
  <canvas id="sheet"></canvas>
  <script>
    // Dev view: every facing and animation of one fighter, drawn large on a floor-colored ground.
    const q = new URLSearchParams(location.search);
    const D = HadesData, S = HadesSprites;
    const kit = q.get('kit') || 'murmillo', k = D.kits[kit];
    const weapon = q.get('weapon') || k.weapon;
    const spec = { team: Number(q.get('team') || (kit === 'sagittarius' ? 1 : 0)), kit, armor: q.get('armor') || k.armor, weapon,
      spare: q.get('spare') || (weapon === k.weapon ? k.reserve : k.weapon), shield: k.shield !== 'none' && !D.weapons[weapon].twoHanded ? k.shield : null, cracks: 0 };
    const unit = Number(q.get('unit') || 100);
    S.setResolution(unit);
    const shape = q.get('shape') || D.weapons[weapon].shape;
    const rows = (q.get('rows') || 'idle,run,windup,active,recover,dash,hurt,stun,dead').split(',');
    // ?facings=3,5 picks directions (0-15); ?scale=2 enlarges the drawing for close inspection.
    const facings = (q.get('facings') || '0,2,4,6,8,10,12,14').split(',').map(d => Number(d) / 16 * Math.PI * 2);
    const zoom = Number(q.get('scale') || 1);
    const cell = unit * 3.9 * zoom, c = document.getElementById('sheet'), g = c.getContext('2d');
    c.width = cell * facings.length; c.height = cell * rows.length;
    g.fillStyle = '#2c4a50'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#cfe'; g.font = '12px system-ui';
    rows.forEach((anim, row) => facings.forEach((facing, col) => {
      const t = anim === 'dead' ? 1 : anim === 'stun' ? .3 : .5;
      const sprite = S.get(spec, facing, anim, ['windup', 'active', 'recover'].includes(anim) ? shape : null, t);
      const x = col * cell + cell / 2, y = row * cell + cell * .86;
      const u = unit * zoom;
      g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(x, y, u * .55, u * .55 * .64, 0, 0, 7); g.fill();
      g.drawImage(sprite.image, x + sprite.x * u, y + sprite.y * u, sprite.w * u, sprite.h * u);
      g.fillStyle = '#cfe'; g.fillText(anim, col * cell + 4, row * cell + 14);
    }));
  </script>
</body>
</html>

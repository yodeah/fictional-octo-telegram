# GitHub Pages is one site, so each deploy publishes every game together:
#   /                 swords-and-sandals                          (Salt & Sand)
#   /arena-2d/        claude/detailed-2d-assets-poc-63e424        (Arena Ledger, 2D art)
#   /underworld/      claude/hades-arena-poc-177873               (Underworld Duel, at hades.html)
#   /underworld-2v2/  claude/multiple-weapons-feasibility-2be7ae  (Underworld Duel with the armory and 2v2)
#   /idle/            claude/idle-rpg-6210f4                      (Ash & Obol PWA: Fight Sim + offline grind; built with npm)
# A push to either of the first two deploys. The others are picked up by the next deploy.
# Keep this file identical on the first two branches.
name: Deploy games to Pages

on:
  push:
    branches: [swords-and-sandals, claude/detailed-2d-assets-poc-63e424]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs, as in GitHub's Pages template: a deploy step right after the
  # upload sometimes can't see the artifact yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swords-and-sandals
          path: salt-and-sand
      - uses: actions/checkout@v4
        with:
          ref: claude/detailed-2d-assets-poc-63e424
          path: arena-2d
      - uses: actions/checkout@v4
        with:
          ref: claude/hades-arena-poc-177873
          path: underworld
      - uses: actions/checkout@v4
        with:
          ref: claude/multiple-weapons-feasibility-2be7ae
          path: underworld-2v2
      - uses: actions/checkout@v4
        with:
          ref: claude/idle-rpg-6210f4
          path: ash-and-obol
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ash-and-obol/idle/package-lock.json
      - name: Build Ash & Obol
        working-directory: ash-and-obol/idle
        run: npm ci && npm run build
      - name: Assemble the site
        run: |
          mkdir site
          rsync -a --exclude .git --exclude .github salt-and-sand/ site/
          rsync -a --exclude .git --exclude .github arena-2d/ site/arena-2d/
          rsync -a --exclude .git --exclude .github underworld/ site/underworld/
          rsync -a --exclude .git --exclude .github underworld-2v2/ site/underworld-2v2/
          rsync -a ash-and-obol/idle/dist/ site/idle/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
